    input,select,textarea{width:100%;border:1px solid #cbdbe3;border-radius:8px;padding:10px 11px;background:#fff;min-height:44px}textarea{min-height:96px;resize:vertical}label{display:grid;gap:6px;font-size:13px;color:#3d5668;margin-bottom:12px}.form-grid{display:grid;gap:14px}.form-grid.two{grid-template-columns:repeat(2,1fr)}.form-grid.three{grid-template-columns:repeat(3,1fr)}.search{margin-bottom:16px}

    .assessment-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:18px}.assessment-main{min-width:0}.score-side{align-self:start;position:sticky;top:92px}.full-span{grid-column:1/-1}.wizard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.wizard-head>strong{font-size:28px;color:var(--primary)}.eyebrow{color:#6d8391;font-size:12px}.progress{height:8px;background:#e9f1f4;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--primary2);border-radius:999px}.progress.wizard{margin:12px 0 20px}.question{padding:14px 0;border-bottom:1px solid #edf2f5}.question-title{display:flex;gap:10px;font-weight:600}.question-title span{width:24px;height:24px;border-radius:50%;background:#e8f5f7;color:var(--primary);display:grid;place-items:center;font-size:12px;flex:none}.ratings{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.ratings button{width:46px;height:42px;border:1px solid #cbdde4;border-radius:8px;background:#fff}.ratings button.selected{background:var(--primary);color:#fff;border-color:var(--primary)}.wizard-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px}.score-card{padding:10px 0;border-bottom:1px solid #edf2f5}.score-head{display:flex;justify-content:space-between;font-size:12px;gap:10px}.score-card .progress{margin:7px 0}.score-card small{color:#748796}
    .report-actions{display:flex;justify-content:flex-end;gap:9px;margin-bottom:12px;flex-wrap:wrap}.report{background:#fff;max-width:900px;margin:auto;padding:32px;border:1px solid #dae7ec;direction:rtl;color:#1f3445}.report-header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--primary);padding-bottom:16px}.report-header h1{margin:0}.report-header p{margin:3px 0;color:#607887}.report-code{font-family:monospace;color:#607887}.report-section{margin-top:22px}.report-section h2{font-size:18px;color:var(--primary);border-bottom:1px solid #dfeaec;padding-bottom:6px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 25px}.report-table th,.report-table td{border:1px solid #d9e5e9}.report-block{background:#f8fbfc;border:1px solid #e4eef1;border-radius:8px;padding:12px;margin:9px 0}.report-block h3{font-size:14px;margin:0 0 5px;color:#35596b}.report-block p{white-space:pre-wrap;margin:0}.report-footer{margin-top:25px;border-top:1px solid #dfeaec;padding-top:14px;font-size:12px;color:#647985}.report-footer div{display:flex;justify-content:space-between;margin-top:18px}
    .mobile-only{display:none!important}.menu-button,.sidebar-close{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:10px;font-size:24px}.menu-button{color:var(--ink)}.sidebar-close{color:#fff;margin-right:auto}.mobile-overlay,.mobile-bottom-nav{display:none}
    .toast{position:fixed;left:18px;bottom:18px;z-index:5000;max-width:min(420px,calc(100vw - 36px));background:#17324d;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 10px 35px rgba(0,0,0,.18)}.toast.error{background:#8f2f2f}
    @media(max-width:900px){.mobile-only{display:inline-flex!important}.app-shell{display:block}.main-area{min-height:100dvh;padding-bottom:76px}.sidebar{position:fixed;z-index:1002;right:0;top:0;bottom:0;width:min(320px,86vw);height:100dvh;transform:translateX(105%);transition:.2s;box-shadow:-18px 0 45px rgba(10,45,65,.22);padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}.sidebar.mobile-open{transform:translateX(0)}.mobile-overlay{display:block;position:fixed;inset:0;z-index:1001;border:0;background:rgba(8,32,45,.46)}.topbar{height:auto;min-height:70px;padding:max(10px,env(safe-area-inset-top)) 12px 10px}.topbar h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar p{font-size:11px}.page-content{padding:14px 12px 20px}.stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}.assessment-layout{grid-template-columns:1fr}.score-side{position:static}.form-grid.two,.form-grid.three,.info-grid,.report-grid{grid-template-columns:1fr}.card-title-row,.profile-card{align-items:stretch;flex-direction:column}.ratings{display:grid;grid-template-columns:repeat(5,1fr)}.ratings button{width:auto;min-height:44px}.mobile-bottom-nav{display:grid!important;grid-template-columns:repeat(3,1fr);position:fixed;z-index:950;right:0;left:0;bottom:0;min-height:62px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #dce8ed;box-shadow:0 -7px 20px rgba(30,65,85,.08)}.mobile-bottom-nav a{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:#607687;font-size:13px;font-weight:700}.mobile-bottom-nav a.active{background:#e9f5f7;color:var(--primary)}.user-chip{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
    @media(max-width:640px){input,select,textarea{font-size:16px}.topbar p,.user-chip{display:none}.stats-grid{grid-template-columns:1fr 1fr}.report{padding:16px 12px}.report-header,.report-footer div{flex-direction:column;align-items:flex-start}.wizard-actions{position:sticky;bottom:70px;background:#fff;padding:10px 0 2px;z-index:20}.actions>*{flex:1 1 150px}.login-page{align-items:start;padding-top:max(28px,env(safe-area-inset-top))}.login-card{padding:24px 18px}}
    @media(max-width:380px){.stats-grid{grid-template-columns:1fr}.page-content{padding-inline:9px}}
    @media print{body{background:#fff}.no-print,.sidebar,.topbar,.mobile-bottom-nav,.mobile-overlay{display:none!important}.app-shell{display:block}.main-area{padding:0}.page-content{padding:0;max-width:none}.report{border:0;max-width:none;padding:0}.report-footer{break-inside:avoid}}

<body>
  <div id="app"><div class="loading-page">جارٍ تشغيل النظام...</div></div>
  <!-- firebase.js منفصل. إذا لم تتم إضافته سيعمل النظام بوضع تجريبي محلي بدل الصفحة البيضاء. -->
  <script src="./firebase.js"></script>
  <script type="module">
  const appRoot = document.getElementById('app');
  const LOCAL_DB_KEY='speechTherapyStandaloneDbV1', DEMO_USER_KEY='speechTherapyStandaloneUserV1';
  const ratingScale=[0,1,2,3,4];
  const assessmentDomains=[
    {id:'oralMotor',title:'الفحص الفموي الحركي ووظائف أعضاء النطق',items:[['lipControl','تحكم مناسب في الشفتين أثناء الكلام والحركات الإرادية'],['tongueMobility','حركة اللسان جيدة من حيث الرفع والبروز والجوانب'],['jawControl','ثبات وتحكم مناسب في الفك أثناء الكلام'],['oralCoordination','تناسق الحركات الفموية المتتابعة'],['breathing','تنفس مناسب للكلام دون انقطاع ملحوظ'],['feeding','المضغ والبلع ووظائف التغذية مناسبة بحسب التاريخ المتاح']]},
    {id:'speechSound',title:'النطق والأصوات والعمليات الفونولوجية',items:[['soundInventory','يمتلك مخزونًا صوتيًا مناسبًا لعمره'],['articulation','دقة مخارج الأصوات في الكلمات والجمل مناسبة'],['intelligibility','درجة وضوح الكلام للمستمع مناسبة'],['phonology','لا تظهر عمليات فونولوجية مؤثرة على الفهم بصورة ملحوظة'],['consistency','الأخطاء الصوتية متسقة ويمكن تحليل نمطها'],['selfMonitoring','يستطيع ملاحظة بعض أخطائه أو تصحيحها عند التوجيه']]},
    {id:'receptiveLanguage',title:'اللغة الاستقبالية',items:[['nameResponse','ينتبه لاسمه وللتوجيه اللفظي'],['oneStep','يفهم وينفذ تعليمات من خطوة واحدة'],['multiStep','يفهم تعليمات مركبة أو متعددة الخطوات بحسب العمر'],['vocabulary','يفهم مفردات وأسماء وأفعال مناسبة لعمره'],['concepts','يفهم المفاهيم الأساسية مثل المكان والكمية والصفات'],['questions','يفهم أسئلة من/ماذا/أين/متى/لماذا بما يناسب العمر'],['storyComprehension','يفهم أحداثًا وتسلسلًا بسيطًا في قصة أو موقف']]},
    {id:'expressiveLanguage',title:'اللغة التعبيرية',items:[['naming','يسمي الأشياء والصور والأفعال المألوفة'],['sentenceLength','طول الجملة مناسب للعمر'],['grammar','يستخدم تراكيب وقواعد لغوية مناسبة'],['needsExpression','يعبر عن احتياجاته ومشاعره بصورة مفهومة'],['description','يصف صورة أو موقفًا باستخدام تفاصيل مناسبة'],['narrative','يسرد حدثًا بتسلسل مفهوم'],['wordFinding','استدعاء الكلمات مناسب دون صعوبة ملحوظة متكررة']]},
    {id:'pragmatics',title:'التواصل الاجتماعي والاستخدام الوظيفي للغة',items:[['initiation','يبادر بالتواصل أو يطلب بصورة مناسبة'],['turnTaking','يحافظ على تبادل الأدوار في الحوار أو اللعب'],['eyeFace','يوجه انتباهه للوجه والإشارات الاجتماعية بحسب الموقف'],['topic','يحافظ على موضوع الحديث بدرجة مناسبة'],['repair','يحاول إصلاح الرسالة عند عدم فهم المستمع'],['nonverbal','يستخدم الإيماءات وتعبيرات الوجه بصورة وظيفية']]},
    {id:'fluency',title:'الطلاقة',items:[['flow','انسيابية الكلام مناسبة دون توقفات أو تكرارات مؤثرة'],['tension','لا يظهر توتر عضلي أو مجهود زائد أثناء الكلام'],['rate','سرعة الكلام مناسبة وتسمح بفهم الرسالة'],['avoidance','لا يتجنب كلمات أو مواقف كلامية بسبب صعوبة الطلاقة']]},
    {id:'voice',title:'الصوت والرنين',items:[['quality','جودة الصوت مناسبة ولا توجد بحة أو خشونة لافتة'],['pitch','طبقة الصوت مناسبة للعمر والجنس'],['loudness','شدة الصوت مناسبة للموقف'],['resonance','الرنين الأنفي/الفموي ضمن المتوقع']]},
    {id:'attentionPlay',title:'الانتباه واللعب والمهارات الداعمة للتواصل',items:[['jointAttention','يشارك في الانتباه المشترك'],['sustainedAttention','يحافظ على الانتباه لنشاط مناسب لعمره'],['imitation','يقلد حركات أو أصواتًا أو كلمات عند الطلب'],['symbolicPlay','يظهر لعبًا وظيفيًا/رمزيًا مناسبًا'],['flexibility','يتقبل الانتقال بين الأنشطة بدرجة مناسبة']]}
  ];
  const state={firebaseEnabled:false,fb:null,user:null,authReady:false,clinicId:'main-clinic',clinicName:'مركز التخاطب',drafts:{}};
  const e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const today=()=>new Date().toISOString().slice(0,10);
  const uid=(p='id')=>`${p}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  const fmtDate=v=>v?String(v).slice(0,10):'—';
  function ageFromDob(dob){if(!dob)return'';const b=new Date(dob),n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;return m<0?'':`${Math.floor(m/12)} سنة و${m%12} شهر`;}
  function calculateScores(responses={}){return Object.fromEntries(assessmentDomains.map(d=>{const vals=d.items.map(([id])=>responses?.[d.id]?.[id]).filter(v=>Number.isFinite(Number(v))).map(Number);const obtained=vals.reduce((a,b)=>a+b,0),answered=vals.length,percent=answered?Math.round(obtained/(answered*4)*100):null;return[d.id,{obtained,max:d.items.length*4,answered,totalItems:d.items.length,percent}]}));}
  function classifyScore(p){if(p==null)return'غير مكتمل';if(p>=85)return'ضمن المتوقع سريريًا';if(p>=70)return'صعوبة بسيطة';if(p>=50)return'صعوبة متوسطة';return'صعوبة ملحوظة';}
  function toast(msg,type=''){let t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
  function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_DB_KEY))||{patients:{},assessments:{},sessions:{},files:{}}}catch{return{patients:{},assessments:{},sessions:{},files:{}}}}
  function saveLocal(d){localStorage.setItem(LOCAL_DB_KEY,JSON.stringify(d))}
  async function initFirebase(){
    const cfg=window.SPEECH_FIREBASE||{}; state.clinicId=cfg.clinicId||'main-clinic'; state.clinicName=cfg.clinicName||'مركز التخاطب';
    const c=cfg.config||{}; const valid=c.apiKey&&c.projectId&&!String(c.apiKey).includes('PUT_YOUR');
    if(!valid){state.firebaseEnabled=false;state.user=JSON.parse(localStorage.getItem(DEMO_USER_KEY)||'null');state.authReady=true;return;}
    try{
      const V='12.18.0';
      const [appM,authM,fsM,stM]=await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-storage.js`)
      ]);
      const app=appM.initializeApp(c),auth=authM.getAuth(app),db=fsM.getFirestore(app),storage=stM.getStorage(app);
      state.fb={appM,authM,fsM,stM,app,auth,db,storage};state.firebaseEnabled=true;
      await new Promise(resolve=>authM.onAuthStateChanged(auth,u=>{state.user=u?{uid:u.uid,email:u.email,displayName:u.displayName}:null;state.authReady=true;resolve()}));
    }catch(err){console.error(err);state.firebaseEnabled=false;state.authReady=true;state.user=JSON.parse(localStorage.getItem(DEMO_USER_KEY)||'null');setTimeout(()=>toast('تعذر تهيئة Firebase؛ تم فتح الوضع التجريبي. راجع firebase.js','error'),300)}
  }
  function normalizeSnap(snap){const d=snap.data();const conv=v=>v?.toDate?.()?.toISOString?.()||v||null;return{id:snap.id,...d,createdAt:conv(d.createdAt),updatedAt:conv(d.updatedAt),assessmentDate:conv(d.assessmentDate),date:conv(d.date)}}
  const repo={
    async listPatients(){if(!state.firebaseEnabled)return Object.values(loadLocal().patients).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));const{fsM,db}=state.fb,q=fsM.query(fsM.collection(db,'clinics',state.clinicId,'patients'),fsM.orderBy('updatedAt','desc'));return(await fsM.getDocs(q)).docs.map(normalizeSnap)},
    async getPatient(id){if(!state.firebaseEnabled)return loadLocal().patients[id]||null;const{fsM,db}=state.fb,s=await fsM.getDoc(fsM.doc(db,'clinics',state.clinicId,'patients',id));return s.exists()?normalizeSnap(s):null},
    async createPatient(data){if(!state.firebaseEnabled){const d=loadLocal(),id=uid('patient'),now=new Date().toISOString();d.patients[id]={id,...data,createdBy:state.user?.uid||'demo',createdAt:now,updatedAt:now};saveLocal(d);return id}const{fsM,db}=state.fb,r=await fsM.addDoc(fsM.collection(db,'clinics',state.clinicId,'patients'),{...data,createdBy:state.user.uid,createdAt:fsM.serverTimestamp(),updatedAt:fsM.serverTimestamp()});return r.id},
    async listAssessments(pid){if(!state.firebaseEnabled)return Object.values(loadLocal().assessments[pid]||{}).sort((a,b)=>(b.assessmentDate||'').localeCompare(a.assessmentDate||''));const{fsM,db}=state.fb,q=fsM.query(fsM.collection(db,'clinics',state.clinicId,'patients',pid,'assessments'),fsM.orderBy('assessmentDate','desc'));return(await fsM.getDocs(q)).docs.map(normalizeSnap)},
    async getAssessment(pid,id){if(!state.firebaseEnabled)return loadLocal().assessments?.[pid]?.[id]||null;const{fsM,db}=state.fb,s=await fsM.getDoc(fsM.doc(db,'clinics',state.clinicId,'patients',pid,'assessments',id));return s.exists()?normalizeSnap(s):null},
    async saveAssessment(pid,data){if(!state.firebaseEnabled){const d=loadLocal(),id=uid('assessment'),now=new Date().toISOString();d.assessments[pid]||={};d.assessments[pid][id]={id,...data,createdBy:state.user?.uid||'demo',createdAt:now,updatedAt:now};saveLocal(d);return id}const{fsM,db}=state.fb,r=await fsM.addDoc(fsM.collection(db,'clinics',state.clinicId,'patients',pid,'assessments'),{...data,createdBy:state.user.uid,createdAt:fsM.serverTimestamp(),updatedAt:fsM.serverTimestamp()});return r.id},

    async saveSession(pid,data){if(!state.firebaseEnabled){const d=loadLocal(),id=uid('session'),now=new Date().toISOString();d.sessions[pid]||={};d.sessions[pid][id]={id,...data,createdBy:state.user?.uid||'demo',createdAt:now,updatedAt:now};saveLocal(d);return id}const{fsM,db}=state.fb,r=await fsM.addDoc(fsM.collection(db,'clinics',state.clinicId,'patients',pid,'sessions'),{...data,createdBy:state.user.uid,createdAt:fsM.serverTimestamp(),updatedAt:fsM.serverTimestamp()});return r.id},

    async uploadFile(pid,file){if(!state.firebaseEnabled)throw new Error('Firebase Storage غير مفعّل');const{fsM,stM,db,storage}=state.fb,safe=file.name.replace(/[^\p{L}\p{N}._-]/gu,'_'),path=`clinics/${state.clinicId}/patients/${pid}/${Date.now()}_${safe}`,sr=stM.ref(storage,path);await stM.uploadBytes(sr,file,{contentType:file.type});const url=await stM.getDownloadURL(sr);await fsM.addDoc(fsM.collection(db,'clinics',state.clinicId,'patients',pid,'files'),{path,url,name:file.name,contentType:file.type,size:file.size,uploadedBy:state.user.uid,createdAt:fsM.serverTimestamp()});}

  function layout(content){return `<div class="app-shell"><button id="overlay" class="mobile-overlay no-print hidden" aria-label="إغلاق القائمة"></button><aside id="sidebar" class="sidebar no-print"><div class="brand"><div class="brand-mark">ST</div><div><strong>${e(state.clinicName)}</strong><small>موديول التخاطب</small></div><button id="closeMenu" class="sidebar-close mobile-only">×</button></div><nav><a class="${navActive('/')}" href="#/">لوحة المتابعة</a><a class="${navActive('/patients')}" href="#/patients">ملفات الأطفال</a><a class="${navActive('/patients/new')}" href="#/patients/new">إضافة حالة جديدة</a></nav><div class="sidebar-foot"><span><span class="status-dot ${state.firebaseEnabled?'online':''}"></span>${state.firebaseEnabled?'Firebase متصل':'وضع تجريبي محلي'}</span><button id="logoutBtn" class="link-button">تسجيل الخروج</button></div></aside><main class="main-area"><header class="topbar no-print"><div class="topbar-start"><button id="openMenu" class="menu-button mobile-only">☰</button><div><h1>نظام أخصائية التخاطب</h1><p>تقييم، خطة علاج، جلسات، متابعة وتقارير</p></div></div><div class="user-chip">${e(state.user?.displayName||state.user?.email||'المستخدم')}</div></header><section class="page-content">${content}</section><nav class="mobile-bottom-nav mobile-only no-print"><a class="${navActive('/')}" href="#/">الرئيسية</a><a class="${navActive('/patients')}" href="#/patients">الحالات</a><a class="${navActive('/patients/new')}" href="#/patients/new">إضافة</a></nav></main></div>`}
  function bindLayout(){const sb=document.getElementById('sidebar'),ov=document.getElementById('overlay');const close=()=>{sb?.classList.remove('mobile-open');ov?.classList.add('hidden')};document.getElementById('openMenu')?.addEventListener('click',()=>{sb.classList.add('mobile-open');ov.classList.remove('hidden')});document.getElementById('closeMenu')?.addEventListener('click',close);ov?.addEventListener('click',close);document.getElementById('logoutBtn')?.addEventListener('click',logout)}
  async function login(email,password){if(!state.firebaseEnabled){const u={uid:'demo-therapist',email,displayName:'أخصائية التخاطب'};localStorage.setItem(DEMO_USER_KEY,JSON.stringify(u));state.user=u;location.hash='#/';return}await state.fb.authM.signInWithEmailAndPassword(state.fb.auth,email,password)}

  function loginPage(){appRoot.innerHTML=`<div class="login-page"><form id="loginForm" class="login-card"><div class="brand-mark large">ST</div><h1>موديول أخصائية التخاطب</h1><p>${state.firebaseEnabled?'تسجيل دخول آمن عبر Firebase Authentication':'وضع تجريبي — أضف إعداداتك في firebase.js للاتصال بـ Firebase'}</p><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><div id="loginError"></div><button class="primary" style="width:100%">دخول</button></form></div>`;document.getElementById('loginForm').addEventListener('submit',async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;try{await login(document.getElementById('email').value,document.getElementById('password').value);render()}catch(err){document.getElementById('loginError').innerHTML=`<div class="alert error">${e(err.message||'تعذر تسجيل الدخول')}</div>`}finally{b.disabled=false}})}

  async function patientNewPage(){return `<form id="patientForm" class="card"><h2>البيانات الأساسية للحالة</h2><div class="form-grid two"><label>اسم الطفل بالكامل<input name="fullName" required></label><label>الجنس<select name="sex" required><option value="">اختر</option><option>ذكر</option><option>أنثى</option></select></label><label>تاريخ الميلاد<input id="dob" name="dob" type="date" required></label><label>العمر الحالي<input id="ageText" name="ageText" readonly></label><label>اسم ولي الأمر<input name="guardianName"></label><label>رقم الهاتف<input name="phone" type="tel"></label><label>المدرسة / الحضانة<input name="school"></label><label>الصف / المستوى<input name="grade"></label><label>مصدر الإحالة<input name="referralSource"></label><label>التشخيص الحالي — إن وجد<input name="diagnosis"></label></div><label>سبب الإحالة / الشكوى الأساسية<textarea name="referralReason"></textarea></label><h3>تاريخ طبي ونمائي مختصر</h3><div class="form-grid two"><label>الحمل والولادة<textarea name="birthHistory"></textarea></label><label>التطور الحركي واللغوي<textarea name="developmentHistory"></textarea></label><label>السمع وفحوصاته<textarea name="hearingHistory"></textarea></label><label>أمراض/عمليات/أدوية<textarea name="medicalHistory"></textarea></label></div><label>ملاحظات الأسرة<textarea name="familyNotes"></textarea></label><div class="actions"><button class="primary">حفظ وفتح الملف</button></div></form>`}
  async function patientDetails(pid){const[p,a,s,f]=await Promise.all([repo.getPatient(pid),repo.listAssessments(pid),repo.listSessions(pid),repo.listFiles(pid)]);if(!p)return'<div class="card">الحالة غير موجودة.</div>';return `<div class="card profile-card"><div><h2>${e(p.fullName)}</h2><p>${e(p.ageText||'')} ${p.sex?`• ${e(p.sex)}`:''}</p><p>${e(p.referralReason||p.diagnosis||'')}</p></div><div class="actions no-print"><a class="button primary" href="#/patients/${e(pid)}/assessment/new">تقييم جديد</a><a class="button secondary" href="#/patients/${e(pid)}/session/new">تسجيل جلسة</a></div></div><div class="info-grid"><div class="card"><h3>بيانات ولي الأمر</h3><p><strong>الاسم:</strong> ${e(p.guardianName||'—')}</p><p><strong>الهاتف:</strong> ${e(p.phone||'—')}</p><p><strong>المدرسة:</strong> ${e(p.school||'—')}</p></div><div class="card"><h3>التاريخ المختصر</h3><p><strong>السمع:</strong> ${e(p.hearingHistory||'—')}</p><p><strong>نمائي:</strong> ${e(p.developmentHistory||'—')}</p></div></div><div class="card"><h3>التقييمات</h3>${a.length?`<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الحالة</th><th>الانطباع</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${e(fmtDate(x.assessmentDate))}</td><td>${x.status==='final'?'نهائي':'مسودة'}</td><td>${e(x.clinicalImpression||'—')}</td><td><a href="#/patients/${e(pid)}/assessment/${e(x.id)}/report">التقرير</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد تقييمات.</div>'}</div><div class="card"><h3>الجلسات</h3>${s.length?`<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المدة</th><th>الأهداف</th><th>التقدم</th></tr></thead><tbody>${s.map(x=>`<tr><td>${e(fmtDate(x.date))}</td><td>${e(x.durationMinutes||'—')} دقيقة</td><td>${e(x.goalsWorked||'—')}</td><td>${e(x.performance||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد جلسات مسجلة.</div>'}</div><div class="card"><h3>الملفات والعينات</h3>${state.firebaseEnabled?`<label class="upload-box">ر   function getDraft(pid){return state.drafts[pid]||(state.drafts[pid]={step:0,responses:{},notes:{assessmentDate:today(),status:'draft',recommendations:'',shortGoals:'',longGoals:'',examiner:state.user?.displayName||state.user?.email||''}})}
  async function assessmentPage(pid){const d=getDraft(pid),domain=assessmentDomains[d.step],scores=calculateScores(d.responses),sc=scores[domain.id];return `<div class="assessment-layout"><div class="card assessment-main"><div class="wizard-head"><div><span class="eyebrow">قسم ${d.step+1} من ${assessmentDomains.length}</span><h2>${e(domain.title)}</h2></div><strong>${sc.percent??'—'}%</strong></div><div class="progress wizard"><div style="width:${((d.step+1)/assessmentDomains.length)*100}%"></div></div>${domain.items.map(([id,label],i)=>`<div class="question"><div class="question-title"><span>${i+1}</span>${e(label)}</div><div class="ratings">${ratingScale.map(v=>`<button type="button" data-rate="${v}" data-domain="${domain.id}" data-item="${id}" class="${d.responses?.[domain.id]?.[id]===v?'selected':''}">${v}</button>`).join('')}</div></div>`).join('')}<label>ملاحظات هذا القسم<textarea id="domainNotes">${e(d.notes[domain.id+'Notes']||'')}</textarea></label><div class="wizard-actions no-print"><button id="prevStep" class="secondary" type="button" ${d.step===0?'disabled':''}>السابق</button>${d.step<assessmentDomains.length-1?'<button id="nextStep" class="primary" type="button">التالي</button>':'<button id="toSummary" class="primary" type="button">الملخص والخطة</button>'}</div></div><aside class="card score-side"><h3>ملخص الدرجات</h3>${assessmentDomains.map(x=>{const z=scores[x.id];return`<div class="score-card"><div class="score-head"><span>${e(x.title)}</span><strong>${z.percent??'—'}${z.percent!=null?'%':''}</strong></div><div class="progress"><div style="width:${z.percent||0}%"></div></div><small>${e(classifyScore(z.percent))} • ${z.answered}/${z.totalItems}</small></div>`}).join('')}</aside><div class="card full-span" id="summary"><h2>الانطباع السريري والخطة</h2><div class="notice">الدرجات مؤشر متابعة داخلي مبني على ملاحظة الأخصائية وليست بديلًا عن اختبار معياري أو تشخيص طبي.</div><div class="form-grid two"><label>تاريخ التقييم<input id="assessmentDate" type="date" value="${e(d.notes.assessmentDate)}"></label><label>اسم الفاحص/الأخصائي<input id="examiner" value="${e(d.notes.examiner||'')}"></label></div>${[['strengths','نقاط القوة'],['needs','الاحتياجات الأساسية'],['clinicalImpression','الانطباع السريري'],['longGoals','الأهداف طويلة المدى'],['shortGoals','الأهداف قصيرة المدى'],['recommendations','التوصيات']].map(([k,l])=>`<label>${l}<textarea id="${k}">${e(d.notes[k]||'')}</textarea></label>`).join('')}<div class="actions"><button id="saveDraft" class="secondary" type="button">حفظ كمسودة</button><button id="finalizeAssessment" class="primary" type="button">اعتماد وإنشاء التقرير</button></div></div></div>`}
  async function sessionPage(pid){return `<form id="sessionForm" class="card"><h2>تسجيل جلسة علاجية</h2><div class="form-grid three"><label>التاريخ<input name="date" type="date" value="${today()}"></label><label>المدة بالدقائق<input name="durationMinutes" type="number" min="10" max="180" value="45"></label><label>الحضور<select name="attendance"><option>حضر</option><option>اعتذر</option><option>غاب</option></select></label></div><label>الأهداف التي تم العمل عليها<textarea name="goalsWorked"></textarea></label><label>الأنشطة والاستراتيجيات المستخدمة<textarea name="activities"></textarea></label><label>الأداء والاستجابة ونسبة النجاح<textarea name="performance" placeholder="مثال: حقق 8/10 محاولات بمساعدة لفظية بسيطة..."></textarea></label><label>واجب منزلي / تدريب الأسرة<textarea name="homeProgram"></textarea></label><label>خطة الجلسة القادمة<textarea name="nextPlan"></textarea></label><div class="actions"><button class="primary">حفظ الجلسة</button></div></form>`}
  async function reportPage(pid,aid){const[p,a]=await Promise.all([repo.getPatient(pid),repo.getAssessment(pid,aid)]);if(!p||!a)return'<div class="card">تعذر العثور على التقرير.</div>';return `<div class="report-actions no-print"><a class="button secondary" href="#/patients/${e(pid)}">عودة للملف</a><button id="printReport" class="secondary">طباعة / حفظ PDF</button><button id="shareReport" class="primary">مشاركة التقرير</button></div><article class="report" id="report"><header class="report-header"><div><h1>${e(state.clinicName)}</h1><p>تقرير تقييم تخاطب ولغة</p></div><div class="report-code">#${e(a.id.slice(-8))}</div></header><section class="report-section"><h2>البيانات الأساسية</h2><div class="report-grid"><p><strong>اسم الطفل:</strong> ${e(p.fullName)}</p><p><strong>العمر:</strong> ${e(p.ageText||'—')}</p><p><strong>تاريخ الميلاد:</strong> ${e(p.dob||'—')}</p><p><strong>ولي الأمر:</strong> ${e(p.guardianName||'—')}</p><p><strong>تاريخ التقييم:</strong> ${e(fmtDate(a.assessmentDate))}</p><p><strong>الفاحص:</strong> ${e(a.examiner||'—')}</p></div><p><strong>سبب الإحالة:</strong> ${e(p.referralReason||'—')}</p></section><section class="report-section"><h2>نتائج الملاحظة السريرية</h2><table class="report-table"><thead><tr><th>المجال</th><th>النسبة</th><th>التصنيف</th><th>الإجابات</th></tr></thead><tbody>${assessmentDomains.map(d=>{const s=a.domainScores?.[d.id]||{};return`<tr><td>${e(d.title)}</td><td>${s.percent??'—'}${s.percent!=null?'%':''}</td><td>${e(classifyScore(s.percent))}</td><td>${s.answered||0}/${s.totalItems||d.items.length}</td></tr>`}).join('')}</tbody></table></section><section class="report-section"><h2>الملخص السريري</h2>${reportBlock('نقاط القوة',a.strengths)}${reportBlock('الاحتياجات الأساسية',a.needs)}${reportBlock('الانطباع السريري',a.clinicalImpression)}</section><section class="report-section"><h2>الخطة العلاجية</h2>${reportBlock('الأهداف طويلة المدى',a.longGoals)}${reportBlock('الأهداف قصيرة المدى',a.shortGoals)}${reportBlock('التوصيات',a.recommendations)}</section><footer class="report-footer"><p>ملاحظة: النسب الظاهرة مؤشر متابعة داخلي قائم على ملاحظة الأخصائية ولا تُعامل كدرجة اختبار معياري إلا إذا تم ربط الموديول بأداة مقننة ومصرح باستخدامها.</p><div><span>توقيع الأخصائية: ____________________</span><span>التاريخ: ____________________</span></div></footer></article>`}
  function reportBlock(t,x){return`<div class="report-block"><h3>${e(t)}</h3><p>${e(x||'—')}</p></div>`}
  function objectFromForm(form){const o={};new FormData(form).forEach((v,k)=>o[k]=v);return o}

    if(path==='/patients/new'){document.getElementById('dob')?.addEventListener('change',ev=>document.getElementById('ageText').value=ageFromDob(ev.target.value));document.getElementById('patientForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;try{const data=objectFromForm(ev.target);data.status='active';const id=await repo.createPatient(data);location.hash=`#/patients/${id}`}catch(err){toast(err.message||'تعذر الحفظ','error')}finally{b.disabled=false}})}
    let m=path.match(/^\/patients\/([^/]+)$/);if(m){const pid=m[1];document.getElementById('patientFile')?.addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;try{toast('جارٍ رفع الملف...');await repo.uploadFile(pid,f);toast('تم رفع الملف');render()}catch(err){toast(err.message||'فشل الرفع','error')}})}
    m=path.match(/^\/patients\/([^/]+)\/assessment\/new$/);if(m){const pid=m[1],d=getDraft(pid);document.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>{syncAssessmentNotes(pid);d.responses[b.dataset.domain]||={};d.responses[b.dataset.domain][b.dataset.item]=Number(b.dataset.rate);render()}));document.getElementById('prevStep')?.addEventListener('click',()=>{syncAssessmentNotes(pid);d.step=Math.max(0,d.step-1);render()});document.getElementById('nextStep')?.addEventListener('click',()=>{syncAssessmentNotes(pid);d.step=Math.min(assessmentDomains.length-1,d.step+1);render()});document.getElementById('toSummary')?.addEventListener('click',()=>document.getElementById('summary')?.scrollIntoView({behavior:'smooth'}));const save=async final=>{syncAssessmentNotes(pid);const payload={...d.notes,status:final?'final':'draft',type:'speech-language-clinical-observation',responses:d.responses,domainScores:calculateScores(d.responses)};try{const id=await repo.saveAssessment(pid,payload);delete state.drafts[pid];location.hash=final?`#/patients/${pid}/assessment/${id}/report`:`#/patients/${pid}`}catch(err){toast(err.message||'تعذر حفظ التقييم','error')}};document.getElementById('saveDraft')?.addEventListener('click',()=>save(false));document.getElementById('finalizeAssessment')?.addEventListener('click',()=>save(true))}
    m=path.match(/^\/patients\/([^/]+)\/session\/new$/);if(m){const pid=m[1];document.getElementById('sessionForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;try{const d=objectFromForm(ev.target);d.durationMinutes=Number(d.durationMinutes||0);await repo.saveSession(pid,d);location.hash=`#/patients/${pid}`}catch(err){toast(err.message||'تعذر حفظ الجلسة','error')}finally{b.disabled=false}})}
    m=path.match(/^\/patients\/([^/]+)\/assessment\/([^/]+)\/report$/);if(m){document.getElementById('printReport')?.addEventListener('click',()=>window.print());document.getElementById('shareReport')?.addEventListener('click',async()=>{const txt=`تقرير تخاطب - ${state.clinicName}`;try{if(navigator.share)await navigator.share({title:txt,text:txt,url:location.href});else{await navigator.clipboard.writeText(location.href);toast('تم نسخ رابط التقرير')}}catch{}})}
  }
  async function render(){if(!state.authReady){appRoot.innerHTML='<div class="loading-page">جارٍ التحقق من الجلسة...</div>';return}if(!state.user){loginPage();return}const path=route();appRoot.innerHTML='<div class="loading-page">جارٍ التحميل...</div>';try{let content;if(path==='/')content=await dashboard();else if(path==='/patients')content=await patientsPage();else if(path==='/patients/new')content=await patientNewPage();else{let m;if((m=path.match(/^\/patients\/([^/]+)$/)))content=await patientDetails(m[1]);else if((m=path.match(/^\/patients\/([^/]+)\/assessment\/new$/)))content=await assessmentPage(m[1]);else if((m=path.match(/^\/patients\/([^/]+)\/session\/new$/)))content=await sessionPage(m[1]);else if((m=path.match(/^\/patients\/([^/]+)\/assessment\/([^/]+)\/report$/)))content=await reportPage(m[1],m[2]);else{location.hash='#/';return}}appRoot.innerHTML=layout(content);await bindPage(path)}catch(err){console.error(err);appRoot.innerHTML=layout(`<div class="card"><h2>حدث خطأ</h2><div class="alert error">${e(err.message||err)}</div><p>راجع إعدادات Firebase وقواعد Firestore/Storage، ثم أعد المحاولة.</p><button class="secondary" onclick="location.reload()">إعادة تحميل</button></div>`);bindLayout()}}
  window.addEventListener('hashchange',render);window.addEventListener('unhandledrejection',ev=>{console.error(ev.reason);toast(ev.reason?.message||'حدث خطأ غير متوقع','error')});
  await initFirebase();
  if(state.firebaseEnabled)state.fb.authM.onAuthStateChanged(state.fb.auth,u=>{state.user=u?{uid:u.uid,email:u.email,displayName:u.displayName}:null;state.authReady=true;render()});
  render();
  </script>
</body>
</html>
