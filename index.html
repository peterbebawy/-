  <title>موديول أخصائية التخاطب</title>
  <style>

    a{color:var(--primary);text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.no-print{}

    .main-area{min-width:0}.topbar{height:76px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}.topbar h1{font-size:19px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:4px 0 0}.topbar-start{display:flex;align-items:center;gap:12px;min-width:0}.user-chip{background:#eff6f8;border-radius:999px;padding:8px 12px;font-size:12px;color:#345b6d}.page-content{padding:22px;max-width:1240px;margin:auto}
    .card{background:#fff;border:1px solid #e4edf1;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(28,67,85,.04)}.card h2{margin-top:0}.card h3{margin-top:0}.card-title-row,.profile-card{display:flex;justify-content:space-between;align-items:center;gap:14px}.profile-card p{margin:4px 0;color:var(--muted)}

    input,select,textarea{width:100%;border:1px solid #cbdbe3;border-radius:8px;padding:10px 11px;background:#fff;min-height:44px}textarea{min-height:96px;resize:vertical}label{display:grid;gap:6px;font-size:13px;color:#3d5668;margin-bottom:12px}.form-grid{display:grid;gap:14px}.form-grid.two{grid-template-columns:repeat(2,1fr)}.form-grid.three{grid-template-columns:repeat(3,1fr)}.search{margin-bottom:16px}
    .table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}.table-wrap table{min-width:680px}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid #e8eff3;font-size:13px}th{color:#607687;background:#f8fbfc}.empty,.notice{padding:14px;border-radius:8px;background:#f3f8fa;color:#647a88}.alert.error{background:#fff0f0;color:var(--danger);padding:10px;border-radius:8px;margin:10px 0}.alert.ok{background:#edf9f3;color:var(--ok);padding:10px;border-radius:8px;margin:10px 0}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.upload-box{border:1px dashed #8db8c7;padding:18px;text-align:center;border-radius:10px;cursor:pointer}.upload-box input{display:none}

    .mobile-only{display:none!important}.menu-button,.sidebar-close{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:10px;font-size:24px}.menu-button{color:var(--ink)}.sidebar-close{color:#fff;margin-right:auto}.mobile-overlay,.mobile-bottom-nav{display:none}

    @media(max-width:640px){input,select,textarea{font-size:16px}.topbar p,.user-chip{display:none}.stats-grid{grid-template-columns:1fr 1fr}.report{padding:16px 12px}.report-header,.report-footer div{flex-direction:column;align-items:flex-start}.wizard-actions{position:sticky;bottom:70px;background:#fff;padding:10px 0 2px;z-index:20}.actions>*{flex:1 1 150px}.login-page{align-items:start;padding-top:max(28px,env(safe-area-inset-top))}.login-card{padding:24px 18px}}
    @media(max-width:380px){.stats-grid{grid-template-columns:1fr}.page-content{padding-inline:9px}}

    .test-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.test-card{border:1px solid #dce8ed;border-radius:14px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:10px}.test-card h3{margin:0;color:var(--primary)}.test-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.test-meta{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#edf6f8;color:#426476;font-size:11px}.test-card .button{margin-top:auto}.scale-legend{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.scale-legend span{font-size:11px;text-align:center;background:#f5f9fa;border:1px solid #dfebef;border-radius:8px;padding:7px 4px;color:#587180}.question-box{border:1px solid #e5eef2;border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}.question-box .question-title{line-height:1.7}.choice-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.choice-btn{border:1px solid #cadce4;background:#fff;border-radius:9px;min-height:48px;padding:5px;font-size:12px;color:#405e6e}.choice-btn strong{display:block;font-size:15px;color:var(--primary);margin-bottom:2px}.choice-btn.selected{background:var(--primary);border-color:var(--primary);color:#fff}.choice-btn.selected strong{color:#fff}.test-progress-label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:8px 0}.result-hero{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.score-ring{width:135px;height:135px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--p)*1%),#e9f1f4 0);position:relative}.score-ring:after{content:'';position:absolute;width:98px;height:98px;border-radius:50%;background:#fff}.score-ring strong{position:relative;z-index:2;font-size:28px;color:var(--primary)}.domain-result{padding:12px 0;border-bottom:1px solid #edf2f5}.domain-result:last-child{border-bottom:0}.test-warning{border-right:4px solid #d7a83e;background:#fff9e9;padding:12px 14px;border-radius:8px;color:#705b24;font-size:12px;line-height:1.7}.answer-count{font-size:12px;color:var(--muted)}
    @media(max-width:900px){.test-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.choice-row{grid-template-columns:1fr}.choice-btn{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:right;padding:10px 12px}.choice-btn strong{margin:0;min-width:24px}.scale-legend{display:none}.result-hero{grid-template-columns:1fr;text-align:center}.score-ring{margin:auto}}
    @media(max-width:560px){.test-grid{grid-template-columns:1fr}}
    @media print{body{background:#fff}.no-print,.sidebar,.topbar,.mobile-bottom-nav,.mobile-overlay{display:none!important}.app-shell{display:block}.main-area{padding:0}.page-content{padding:0;max-width:none}.report{border:0;max-width:none;padding:0}.report-footer{break-inside:avoid}}

<body>
  <div id="app"><div class="loading-page">جارٍ تشغيل النظام...</div></div>
  <!-- firebase.js منفصل. إذا لم تتم إضافته سيعمل النظام بوضع تجريبي محلي بدل الصفحة البيضاء. -->
  <script src="./firebase.js"></script>
  <script type="module">
  const appRoot = document.getElementById('app');
  const LOCAL_DB_KEY='speechTherapyStandaloneDbV1', DEMO_USER_KEY='speechTherapyStandaloneUserV1';
  const ratingScale=[0,1,2,3,4];
  const assessmentDomains=[
    {id:'oralMotor',title:'الفحص الفموي الحركي ووظائف أعضاء النطق',items:[['lipControl','تحكم مناسب في الشفتين أثناء الكلام والحركات الإرادية'],['tongueMobility','حركة اللسان جيدة من حيث الرفع والبروز والجوانب'],['jawControl','ثبات وتحكم مناسب في الفك أثناء الكلام'],['oralCoordination','تناسق الحركات الفموية المتتابعة'],['breathing','تنفس مناسب للكلام دون انقطاع ملحوظ'],['feeding','المضغ والبلع ووظائف التغذية مناسبة بحسب التاريخ المتاح']]},
    {id:'speechSound',title:'النطق والأصوات والعمليات الفونولوجية',items:[['soundInventory','يمتلك مخزونًا صوتيًا مناسبًا لعمره'],['articulation','دقة مخارج الأصوات في الكلمات والجمل مناسبة'],['intelligibility','درجة وضوح الكلام للمستمع مناسبة'],['phonology','لا تظهر عمليات فونولوجية مؤثرة على الفهم بصورة ملحوظة'],['consistency','الأخطاء الصوتية متسقة ويمكن تحليل نمطها'],['selfMonitoring','يستطيع ملاحظة بعض أخطائه أو تصحيحها عند التوجيه']]},
    {id:'receptiveLanguage',title:'اللغة الاستقبالية',items:[['nameResponse','ينتبه لاسمه وللتوجيه اللفظي'],['oneStep','يفهم وينفذ تعليمات من خطوة واحدة'],['multiStep','يفهم تعليمات مركبة أو متعددة الخطوات بحسب العمر'],['vocabulary','يفهم مفردات وأسماء وأفعال مناسبة لعمره'],['concepts','يفهم المفاهيم الأساسية مثل المكان والكمية والصفات'],['questions','يفهم أسئلة من/ماذا/أين/متى/لماذا بما يناسب العمر'],['storyComprehension','يفهم أحداثًا وتسلسلًا بسيطًا في قصة أو موقف']]},
    {id:'expressiveLanguage',title:'اللغة التعبيرية',items:[['naming','يسمي الأشياء والصور والأفعال المألوفة'],['sentenceLength','طول الجملة مناسب للعمر'],['grammar','يستخدم تراكيب وقواعد لغوية مناسبة'],['needsExpression','يعبر عن احتياجاته ومشاعره بصورة مفهومة'],['description','يصف صورة أو موقفًا باستخدام تفاصيل مناسبة'],['narrative','يسرد حدثًا بتسلسل مفهوم'],['wordFinding','استدعاء الكلمات مناسب دون صعوبة ملحوظة متكررة']]},
    {id:'pragmatics',title:'التواصل الاجتماعي والاستخدام الوظيفي للغة',items:[['initiation','يبادر بالتواصل أو يطلب بصورة مناسبة'],['turnTaking','يحافظ على تبادل الأدوار في الحوار أو اللعب'],['eyeFace','يوجه انتباهه للوجه والإشارات الاجتماعية بحسب الموقف'],['topic','يحافظ على موضوع الحديث بدرجة مناسبة'],['repair','يحاول إصلاح الرسالة عند عدم فهم المستمع'],['nonverbal','يستخدم الإيماءات وتعبيرات الوجه بصورة وظيفية']]},
    {id:'fluency',title:'الطلاقة',items:[['flow','انسيابية الكلام مناسبة دون توقفات أو تكرارات مؤثرة'],['tension','لا يظهر توتر عضلي أو مجهود زائد أثناء الكلام'],['rate','سرعة الكلام مناسبة وتسمح بفهم الرسالة'],['avoidance','لا يتجنب كلمات أو مواقف كلامية بسبب صعوبة الطلاقة']]},
    {id:'voice',title:'الصوت والرنين',items:[['quality','جودة الصوت مناسبة ولا توجد بحة أو خشونة لافتة'],['pitch','طبقة الصوت مناسبة للعمر والجنس'],['loudness','شدة الصوت مناسبة للموقف'],['resonance','الرنين الأنفي/الفموي ضمن المتوقع']]},
    {id:'attentionPlay',title:'الانتباه واللعب والمهارات الداعمة للتواصل',items:[['jointAttention','يشارك في الانتباه المشترك'],['sustainedAttention','يحافظ على الانتباه لنشاط مناسب لعمره'],['imitation','يقلد حركات أو أصواتًا أو كلمات عند الطلب'],['symbolicPlay','يظهر لعبًا وظيفيًا/رمزيًا مناسبًا'],['flexibility','يتقبل الانتقال بين الأنشطة بدرجة مناسبة']]}
  ];

  const testCatalog=[
    {
      id:'earlyCommunication',title:'فحص التواصل واللغة المبكرة',age:'من 1 إلى 4 سنوات',duration:'10–15 دقيقة',direction:'skill',
      description:'مسح وظيفي لمهارات ما قبل اللغة والانتباه المشترك والفهم والتعبير واللعب.',
      sections:[
        {id:'preLanguage',title:'مهارات ما قبل اللغة',items:[
          'ينتبه لوجه المتحدث وصوته عند التفاعل معه','يستجيب لاسمه في أغلب المواقف','يشارك في الانتباه المشترك نحو لعبة أو حدث','يتابع إشارة الإصبع أو اتجاه نظر الشخص الآخر','يستخدم الإشارة أو الإيماءة لطلب شيء أو لفت الانتباه','يقلد حركات بسيطة أثناء اللعب','يقلد أصواتًا أو مقاطع عند التشجيع'
        ]},
        {id:'receptive',title:'الفهم اللغوي المبكر',items:[
          'يفهم أسماء الأشخاص والأشياء المألوفة','ينفذ أمرًا بسيطًا من خطوة واحدة دون إشارة','يفهم أفعالًا مألوفة مثل هات واجلس وافتح','يفهم مفاهيم بسيطة مثل فوق وتحت وجوا وبره','يختار الشيء الصحيح عند تسميته بين بديلين أو أكثر','يفهم أسئلة بسيطة مثل فين ومين وإيه'
        ]},
        {id:'expressive',title:'التعبير اللغوي المبكر',items:[
          'يستخدم أصواتًا أو كلمات بقصد التواصل','يسمي أشياء أو أشخاصًا مألوفين','يستخدم كلمات وظيفية للطلب والرفض والنداء','يجمع كلمتين أو أكثر بما يناسب مرحلته العمرية','يستخدم أفعالًا أو صفات في كلامه','يطلب المساعدة أو يعبّر عن احتياجه بصورة مفهومة'
        ]},
        {id:'play',title:'اللعب والتفاعل',items:[
          'يستخدم الألعاب استخدامًا وظيفيًا','يقلد نموذج لعب يقدمه البالغ','يظهر لعبًا رمزيًا بسيطًا مثل إطعام العروسة','يتبادل الدور في لعبة قصيرة','يحافظ على نشاط مشترك لمدة مناسبة لعمره'
        ]}
      ]
    },

    async getAssessment(pid,id){if(!state.firebaseEnabled)return loadLocal().assessments?.[pid]?.[id]||null;const{fsM,db}=state.fb,s=await fsM.getDoc(fsM.doc(db,'clinics',state.clinicId,'patients',pid,'assessments',id));return s.exists()?normalizeSnap(s):null},
    async saveAssessment(pid,data){if(!state.firebaseEnabled){const d=loadLocal(),id=uid('assessment'),now=new Date().toISOString();d.assessments[pid]||={};d.assessments[pid][id]={id,...data,createdBy:state.user?.uid||'demo',createdAt:now,updatedAt:now};saveLocal(d);return id}const{fsM,db}=state.fb,r=await fsM.addDoc(fsM.collection(db,'clinics',state.clinicId,'patients',pid,'assessments'),{...data,createdBy:state.user.uid,createdAt:fsM.serverTimestamp(),updatedAt:fsM.serverTimestamp()});return r.id},

    async saveSession(pid,data){if(!state.firebaseEnabled){const d=loadLocal(),id=uid('session'),now=new Date().toISOString();d.sessions[pid]||={};d.sessions[pid][id]={id,...data,createdBy:state.user?.uid||'demo',createdAt:now,updatedAt:now};saveLocal(d);return id}const{fsM,db}=state.fb,r=await fsM.addDoc(fsM.collection(db,'clinics',state.clinicId,'patients',pid,'sessions'),{...data,createdBy:state.user.uid,createdAt:fsM.serverTimestamp(),updatedAt:fsM.serverTimestamp()});return r.id},
    async listFiles(pid){if(!state.firebaseEnabled)return[];const{fsM,db}=state.fb,q=fsM.query(fsM.collection(db,'clinics',state.clinicId,'patients',pid,'files'),fsM.orderBy('createdAt','desc'));return(await fsM.getDocs(q)).docs.map(normalizeSnap)},
    async uploadFile(pid,file){if(!state.firebaseEnabled)throw new Error('Firebase Storage غير مفعّل');const{fsM,stM,db,storage}=state.fb,safe=file.name.replace(/[^\p{L}\p{N}._-]/gu,'_'),path=`clinics/${state.clinicId}/patients/${pid}/${Date.now()}_${safe}`,sr=stM.ref(storage,path);await stM.uploadBytes(sr,file,{contentType:file.type});const url=await stM.getDownloadURL(sr);await fsM.addDoc(fsM.collection(db,'clinics',state.clinicId,'patients',pid,'files'),{path,url,name:file.name,contentType:file.type,size:file.size,uploadedBy:state.user.uid,createdAt:fsM.serverTimestamp()});}
  };

  async function testRunPage(pid,testId){const p=await repo.getPatient(pid),test=findTest(testId);if(!p||!test)return'<div class="card">الاختبار غير موجود.</div>';const d=getTestDraft(pid,testId),sec=test.sections[d.section],score=scoreTest(test,d.responses),scale=answerScales[test.direction];return `<div class="card"><div class="card-title-row"><div><span class="eyebrow">${e(test.age)} • ${e(test.duration)}</span><h2>${e(test.title)}</h2><p style="color:var(--muted);margin:4px 0">الحالة: ${e(p.fullName)} — ${e(p.ageText||'')}</p></div><a class="button secondary" href="#/patients/${e(pid)}/tests">تغيير الاختبار</a></div><div class="test-warning">اختر الإجابة التي تصف أداء الطفل في أغلب المواقف. النتيجة هنا مسح سريري للمساعدة في تنظيم التقييم وليست تشخيصًا مستقلًا.</div></div>

  function getDraft(pid){return state.drafts[pid]||(state.drafts[pid]={step:0,responses:{},notes:{assessmentDate:today(),status:'draft',recommendations:'',shortGoals:'',longGoals:'',examiner:state.user?.displayName||state.user?.email||''}})}
  async function assessmentPage(pid){const d=getDraft(pid),domain=assessmentDomains[d.step],scores=calculateScores(d.responses),sc=scores[domain.id];return `<div class="assessment-layout"><div class="card assessment-main"><div class="wizard-head"><div><span class="eyebrow">قسم ${d.step+1} من ${assessmentDomains.length}</span><h2>${e(domain.title)}</h2></div><strong>${sc.percent??'—'}%</strong></div><div class="progress wizard"><div style="width:${((d.step+1)/assessmentDomains.length)*100}%"></div></div>${domain.items.map(([id,label],i)=>`<div class="question"><div class="question-title"><span>${i+1}</span>${e(label)}</div><div class="ratings">${ratingScale.map(v=>`<button type="button" data-rate="${v}" data-domain="${domain.id}" data-item="${id}" class="${d.responses?.[domain.id]?.[id]===v?'selected':''}">${v}</button>`).join('')}</div></div>`).join('')}<label>ملاحظات هذا القسم<textarea id="domainNotes">${e(d.notes[domain.id+'Notes']||'')}</textarea></label><div class="wizard-actions no-print"><button id="prevStep" class="secondary" type="button" ${d.step===0?'disabled':''}>السابق</button>${d.step<assessmentDomains.length-1?'<button id="nextStep" class="primary" type="button">التالي</button>':'<button id="toSummary" class="primary" type="button">الملخص والخطة</button>'}</div></div><aside class="card score-side"><h3>ملخص الدرجات</h3>${assessmentDomains.map(x=>{const z=scores[x.id];return`<div class="score-card"><div class="score-head"><span>${e(x.title)}</span><strong>${z.percent??'—'}${z.percent!=null?'%':''}</strong></div><div class="progress"><div style="width:${z.percent||0}%"></div></div><small>${e(classifyScore(z.percent))} • ${z.answered}/${z.totalItems}</small></div>`}).join('')}</aside><div class="card full-span" id="summary"><h2>الانطباع السريري والخطة</h2><div class="notice">الدرجات مؤشر متابعة داخلي مبني على ملاحظة الأخصائية وليست بديلًا عن اختبار معياري أو تشخيص طبي.</div><div class="form-grid two"><label>تاريخ التقييم<input id="assessmentDate" type="date" value="${e(d.notes.assessmentDate)}"></label><label>اسم الفاحص/الأخصائي<input id="examiner" value="${e(d.notes.examiner||'')}"></label></div>${[['strengths','نقاط القوة'],['needs','الاحتياجات الأساسية'],['clinicalImpression','الانطباع السريري'],['longGoals','الأهداف طويلة المدى'],['shortGoals','الأهداف قصيرة المدى'],['recommendations','التوصيات']].map(([k,l])=>`<label>${l}<textarea id="${k}">${e(d.notes[k]||'')}</textarea></label>`).join('')}<div class="actions"><button id="saveDraft" class="secondary" type="button">حفظ كمسودة</button><button id="finalizeAssessment" class="primary" type="button">اعتماد وإنشاء التقرير</button></div></div></div>`}
  async function sessionPage(pid){return `<form id="sessionForm" class="card"><h2>تسجيل جلسة علاجية</h2><div class="form-grid three"><label>التاريخ<input name="date" type="date" value="${today()}"></label><label>المدة بالدقائق<input name="durationMinutes" type="number" min="10" max="180" value="45"></label><label>الحضور<select name="attendance"><option>حضر</option><option>اعتذر</option><option>غاب</option></select></label></div><label>الأهداف التي تم العمل عليها<textarea name="goalsWorked"></textarea></label><label>الأنشطة والاستراتيجيات المستخدمة<textarea name="activities"></textarea></label><label>الأداء والاستجابة ونسبة النجاح<textarea name="performance" placeholder="مثال: حقق 8/10 محاولات بمساعدة لفظية بسيطة..."></textarea></label><label>واجب منزلي / تدريب الأسرة<textarea name="homeProgram"></textarea></label><label>خطة الجلسة القادمة<textarea name="nextPlan"></textarea></label><div class="actions"><button class="primary">حفظ الجلسة</button></div></form>`}
  async function reportPage(pid,aid){const[p,a]=await Promise.all([repo.getPatient(pid),repo.getAssessment(pid,aid)]);if(!p||!a)return'<div class="card">تعذر العثور على التقرير.</div>';
    if(a.type==='screening-test'){
      const test=findTest(a.testId);if(!test)return'<div class="card">تعذر العثور على تعريف الاختبار.</div>';const sc=a.testScore||scoreTest(test,a.responses||{});return `<div class="report-actions no-print"><a class="button secondary" href="#/patients/${e(pid)}">عودة للملف</a><button id="printReport" class="secondary">طباعة / حفظ PDF</button><button id="shareReport" class="primary">مشاركة التقرير</button></div><article class="report" id="report"><header class="report-header"><div><h1>${e(state.clinicName)}</h1><p>${e(test.title)}</p></div><div class="report-code">#${e(a.id.slice(-8))}</div></header><section class="report-section"><h2>البيانات الأساسية</h2><div class="report-grid"><p><strong>اسم الطفل:</strong> ${e(p.fullName)}</p><p><strong>العمر:</strong> ${e(p.ageText||'—')}</p><p><strong>تاريخ الميلاد:</strong> ${e(p.dob||'—')}</p><p><strong>ولي الأمر:</strong> ${e(p.guardianName||'—')}</p><p><strong>تاريخ التطبيق:</strong> ${e(fmtDate(a.assessmentDate))}</p><p><strong>الفاحص:</strong> ${e(a.examiner||'—')}</p></div></section><section class="report-section"><h2>النتيجة</h2><div class="result-hero"><div class="score-ring" style="--p:${sc.performance||0}"><strong>${sc.performance??'—'}${sc.performance!=null?'%':''}</strong></div><div><h3>${e(a.testInterpretation||testInterpret(test,sc))}</h3><p>تمت الإجابة عن ${sc.answered}/${sc.totalItems} بند.</p></div></div><table class="report-table" style="margin-top:16px"><thead><tr><th>المجال</th><th>${test.direction==='risk'?'مؤشر الأداء الأفضل':'الأداء'}</th><th>البنود</th></tr></thead><tbody>${test.sections.map(sec=>{const z=sc.domains?.[sec.id]||{};const val=z.percent==null?'—':(test.direction==='risk'?100-z.percent:z.percent)+'%';return`<tr><td>${e(sec.title)}</td><td>${val}</td><td>${z.answered||0}/${z.totalItems||sec.items.length}</td></tr>`}).join('')}</tbody></table></section><section class="report-section"><h2>الملاحظات والتوصيات</h2>${reportBlock('الملاحظات السريرية',a.clinicalNotes)}${reportBlock('التوصيات / الخطوة التالية',a.recommendations)}</section><footer class="report-footer"><p>هذه قائمة مسح سريرية داخلية وليست اختبارًا معياريًا مقننًا. لا يُعتمد عليها منفردة للتشخيص أو لإصدار حكم علاجي نهائي.</p><div><span>توقيع الأخصائية: ____________________</span><span>التاريخ: ____________________</span></div></footer></article>`
    }
    return `<div class="report-actions no-print"><a class="button secondary" href="#/patients/${e(pid)}">عودة للملف</a><button id="printReport" class="secondary">طباعة / حفظ PDF</button><button id="shareReport" class="primary">مشاركة التقرير</button></div><article class="report" id="report"><header class="report-header"><div><h1>${e(state.clinicName)}</h1><p>تقرير تقييم تخاطب ولغة</p></div><div class="report-code">#${e(a.id.slice(-8))}</div></header><section class="report-section"><h2>البيانات الأساسية</h2><div class="report-grid"><p><strong>اسم الطفل:</strong> ${e(p.fullName)}</p><p><strong>العمر:</strong> ${e(p.ageText||'—')}</p><p><strong>تاريخ الميلاد:</strong> ${e(p.dob||'—')}</p><p><strong>ولي الأمر:</strong> ${e(p.guardianName||'—')}</p><p><strong>تاريخ التقييم:</strong> ${e(fmtDate(a.assessmentDate))}</p><p><strong>الفاحص:</strong> ${e(a.examiner||'—')}</p></div><p><strong>سبب الإحالة:</strong> ${e(p.referralReason||'—')}</p></section><section class="report-section"><h2>نتائج الملاحظة السريرية</h2><table class="report-table"><thead><tr><th>المجال</th><th>النسبة</th><th>التصنيف</th><th>الإجابات</th></tr></thead><tbody>${assessmentDomains.map(d=>{const s=a.domainScores?.[d.id]||{};return`<tr><td>${e(d.title)}</td><td>${s.percent??'—'}${s.percent!=null?'%':''}</td><td>${e(classifyScore(s.percent))}</td><td>${s.answered||0}/${s.totalItems||d.items.length}</td></tr>`}).join('')}</tbody></table></section><section class="report-section"><h2>الملخص السريري</h2>${reportBlock('نقاط القوة',a.strengths)}${reportBlock('الاحتياجات الأساسية',a.needs)}${reportBlock('الانطباع السريري',a.clinicalImpression)}</section><section class="report-section"><h2>الخطة العلاجية</h2>${reportBlock('الأهداف طويلة المدى',a.longGoals)}${reportBlock('الأهداف قصيرة المدى',a.shortGoals)}${reportBlock('التوصيات',a.recommendations)}</section><footer class="report-footer"><p>ملاحظة: النسب الظاهرة مؤشر متابعة داخلي قائم على ملاحظة الأخصائية ولا تُعامل كدرجة اختبار معياري إلا إذا تم ربط الموديول بأداة مقننة ومصرح باستخدامها.</p><div><span>توقيع الأخصائية: ____________________</span><span>التاريخ: ____________________</span></div></footer></article>`
  }
  function reportBlock(t,x){return`<div class="report-block"><h3>${e(t)}</h3><p>${e(x||'—')}</p></div>`}
  function objectFromForm(form){const o={};new FormData(form).forEach((v,k)=>o[k]=v);return o}
  function syncAssessmentNotes(pid){const d=getDraft(pid);const dn=document.getElementById('domainNotes');if(dn)d.notes[assessmentDomains[d.step].id+'Notes']=dn.value;['assessmentDate','examiner','strengths','needs','clinicalImpression','longGoals','shortGoals','recommendations'].forEach(k=>{const x=document.getElementById(k);if(x)d.notes[k]=x.value})}
  function syncTestNotes(pid,testId){const d=getTestDraft(pid,testId),test=findTest(testId),sec=test?.sections?.[d.section];const n=document.getElementById('testSectionNotes');if(n&&sec)d.notes[sec.id+'Notes']=n.value;[['testDate','assessmentDate'],['testExaminer','examiner'],['testClinicalNotes','clinicalNotes'],['testRecommendations','recommendations']].forEach(([id,k])=>{const x=document.getElementById(id);if(x)d.notes[k]=x.value})}
  async function bindPage(path){bindLayout();
    if(path==='/patients'){const ps=await repo.listPatients();document.getElementById('patientSearch')?.addEventListener('input',ev=>{const q=ev.target.value.trim().toLowerCase(),f=!q?ps:ps.filter(p=>[p.fullName,p.guardianName,p.phone,p.diagnosis,p.referralReason].join(' ').toLowerCase().includes(q));document.getElementById('patientsBody').innerHTML=patientsRows(f)})}
    if(path==='/patients/new'){document.getElementById('dob')?.addEventListener('change',ev=>document.getElementById('ageText').value=ageFromDob(ev.target.value));document.getElementById('patientForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;try{const data=objectFromForm(ev.target);data.status='active';const id=await repo.createPatient(data);location.hash=`#/patients/${id}`}catch(err){toast(err.message||'تعذر الحفظ','error')}finally{b.disabled=false}})}
    let m=path.match(/^\/patients\/([^/]+)$/);if(m){const pid=m[1];document.getElementById('patientFile')?.addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;try{toast('جارٍ رفع الملف...');await repo.uploadFile(pid,f);toast('تم رفع الملف');render()}catch(err){toast(err.message||'فشل الرفع','error')}})}
    m=path.match(/^\/patients\/([^/]+)\/assessment\/new$/);if(m){const pid=m[1],d=getDraft(pid);document.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>{syncAssessmentNotes(pid);d.responses[b.dataset.domain]||={};d.responses[b.dataset.domain][b.dataset.item]=Number(b.dataset.rate);render()}));document.getElementById('prevStep')?.addEventListener('click',()=>{syncAssessmentNotes(pid);d.step=Math.max(0,d.step-1);render()});document.getElementById('nextStep')?.addEventListener('click',()=>{syncAssessmentNotes(pid);d.step=Math.min(assessmentDomains.length-1,d.step+1);render()});document.getElementById('toSummary')?.addEventListener('click',()=>document.getElementById('summary')?.scrollIntoView({behavior:'smooth'}));const save=async final=>{syncAssessmentNotes(pid);const payload={...d.notes,status:final?'final':'draft',type:'speech-language-clinical-observation',responses:d.responses,domainScores:calculateScores(d.responses)};try{const id=await repo.saveAssessment(pid,payload);delete state.drafts[pid];location.hash=final?`#/patients/${pid}/assessment/${id}/report`:`#/patients/${pid}`}catch(err){toast(err.message||'تعذر حفظ التقييم','error')}};document.getElementById('saveDraft')?.addEventListener('click',()=>save(false));document.getElementById('finalizeAssessment')?.addEventListener('click',()=>save(true))}
    m=path.match(/^\/patients\/([^/]+)\/tests\/([^/]+)\/new$/);if(m){const pid=m[1],testId=m[2],d=getTestDraft(pid,testId),test=findTest(testId);document.querySelectorAll('[data-test-rate]').forEach(b=>b.addEventListener('click',()=>{syncTestNotes(pid,testId);d.responses[b.dataset.section]||={};d.responses[b.dataset.section][Number(b.dataset.index)]=Number(b.dataset.testRate);render()}));document.getElementById('testPrev')?.addEventListener('click',()=>{syncTestNotes(pid,testId);d.section=Math.max(0,d.section-1);render()});document.getElementById('testNext')?.addEventListener('click',()=>{syncTestNotes(pid,testId);d.section=Math.min(test.sections.length-1,d.section+1);render()});document.getElementById('testSummaryBtn')?.addEventListener('click',()=>document.getElementById('testSummary')?.scrollIntoView({behavior:'smooth'}));const saveTest=async final=>{syncTestNotes(pid,testId);const score=scoreTest(test,d.responses);const payload={...d.notes,status:final?'final':'draft',type:'screening-test',testId:test.id,testTitle:test.title,responses:d.responses,testScore:score,testInterpretation:testInterpret(test,score)};try{const id=await repo.saveAssessment(pid,payload);delete state.drafts[`test:${pid}:${testId}`];location.hash=final?`#/patients/${pid}/assessment/${id}/report`:`#/patients/${pid}`}catch(err){toast(err.message||'تعذر حفظ الاختبار','error')}};document.getElementById('saveTestDraft')?.addEventListener('click',()=>saveTest(false));document.getElementById('finishTest')?.addEventListener('click',()=>saveTest(true))}
    m=path.match(/^\/patients\/([^/]+)\/session\/new$/);if(m){const pid=m[1];document.getElementById('sessionForm')?.addEventListener('submit',async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;try{const d=objectFromForm(ev.target);d.durationMinutes=Number(d.durationMinutes||0);await repo.saveSession(pid,d);location.hash=`#/patients/${pid}`}catch(err){toast(err.message||'تعذر حفظ الجلسة','error')}finally{b.disabled=false}})}
    m=path.match(/^\/patients\/([^/]+)\/assessment\/([^/]+)\/report$/);if(m){document.getElementById('printReport')?.addEventListener('click',()=>window.print());document.getElementById('shareReport')?.addEventListener('click',async()=>{const txt=`تقرير تخاطب - ${state.clinicName}`;try{if(navigator.share)await navigator.share({title:txt,text:txt,url:location.href});else{await navigator.clipboard.writeText(location.href);toast('تم نسخ رابط التقرير')}}catch{}})}
  }
  async function render(){if(!state.authReady){appRoot.innerHTML='<div class="loading-page">جارٍ التحقق من الجلسة...</div>';return}if(!state.user){loginPage();return}const path=route();appRoot.innerHTML='<div class="loading-page">جارٍ التحميل...</div>';try{let content;if(path==='/')content=await dashboard();else if(path==='/patients')content=await patientsPage();else if(path==='/patients/new')content=await patientNewPage();else{let m;if((m=path.match(/^\/patients\/([^/]+)$/)))content=await patientDetails(m[1]);else if((m=path.match(/^\/patients\/([^/]+)\/tests$/)))content=await testsPage(m[1]);else if((m=path.match(/^\/patients\/([^/]+)\/tests\/([^/]+)\/new$/)))content=await testRunPage(m[1],m[2]);else if((m=path.match(/^\/patients\/([^/]+)\/assessment\/new$/)))content=await assessmentPage(m[1]);else if((m=path.match(/^\/patients\/([^/]+)\/session\/new$/)))content=await sessionPage(m[1]);else if((m=path.match(/^\/patients\/([^/]+)\/assessment\/([^/]+)\/report$/)))content=await reportPage(m[1],m[2]);else{location.hash='#/';return}}appRoot.innerHTML=layout(content);await bindPage(path)}catch(err){console.error(err);appRoot.innerHTML=layout(`<div class="card"><h2>حدث خطأ</h2><div class="alert error">${e(err.message||err)}</div><p>راجع إعدادات Firebase وقواعد Firestore/Storage، ثم أعد المحاولة.</p><button class="secondary" onclick="location.reload()">إعادة تحميل</button></div>`);bindLayout()}}
  window.addEventListener('hashchange',render);window.addEventListener('unhandledrejection',ev=>{console.error(ev.reason);toast(ev.reason?.message||'حدث خطأ غير متوقع','error')});
  await initFirebase();
  if(state.firebaseEnabled)state.fb.authM.onAuthStateChanged(state.fb.auth,u=>{state.user=u?{uid:u.uid,email:u.email,displayName:u.displayName}:null;state.authReady=true;render()});
  render();
  </script>
</body>
</html>
